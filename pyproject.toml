[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flingus"
version = "1.0.0"
authors = [
  { name="Seu Nome", email="seu_email@example.com" },
]
description = "A plain-English programming language that is easier than Python."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
flingus = "flingus.interpreter:main"
